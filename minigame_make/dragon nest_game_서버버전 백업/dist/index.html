<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dragon Nest</title>
  <script type="module" crossorigin src="/assets/index-d6enduJA.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Cus0Nl1F.css">
</head>
<body>
  <div id="app">

    <!-- 로비 화면 -->
    <div id="lobby-screen">
      <div class="top-bar">
        <span class="title-badge">🐉 Dragon Nest</span>
        <div class="top-right">
          <span id="lobby-ball-counter" class="ball-badge">🔵 6</span>
          <button id="reset-btn" class="sketch-btn sm">리셋</button>
        </div>
      </div>
      <div id="grand-prize-section">
        <div id="grand-prize-chest">
          <div id="grand-prize-icon">🎁</div>
          <div>
            <div class="gp-label">Grand Prize</div>
            <div id="gp-status" class="gp-status">드래곤 4마리 완성 시 획득</div>
          </div>
        </div>
      </div>
      <div id="dragon-grid"></div>
    </div>

    <!-- 핀볼 화면 -->
    <div id="pinball-screen" style="display:none">
      <div id="pinball-header">
        <button id="back-btn" class="sketch-btn sm">← 로비</button>
        <div id="ui-dragon-header">드래곤</div>
        <div class="header-right">
          <span id="ui-ball-counter" class="ball-badge">🔵 6</span>
          <button id="debug-add-balls" class="debug-btn">+10 🔵</button>
        </div>
      </div>
      <div id="ui-partner-gauge">
        <span id="gauge-my-score" class="gauge-score my-score">0</span>
        <div class="gauge-track">
          <div id="gauge-my" class="gauge-fill gf-my"></div>
          <div id="gauge-partner" class="gauge-fill gf-partner"></div>
        </div>
        <span id="gauge-partner-score" class="gauge-score partner-score">0</span>
      </div>
      <div id="ui-stage-gauge">
        <span class="stage-icon">🥚</span>
        <div class="stage-bar-wrap">
          <div id="stage-bar-fill"></div>
          <div class="stage-mark" id="stage-mark-50"></div>
        </div>
        <span class="stage-icon">💎</span>
        <span id="stage-label" class="stage-label">1/3</span>
      </div>
      <div id="canvas-wrap">
        <canvas id="canvas-pinball" width="390" height="420"></canvas>
        <div id="float-layer"></div>
      </div>
      <div id="ui-multiplier-btns">
        <button class="mult-btn active" data-mult="1">x1<br><small>1구슬</small></button>
        <button class="mult-btn" data-mult="5">x5<br><small>5구슬</small></button>
        <button class="mult-btn" data-mult="10">x10<br><small>10구슬</small></button>
        <button class="mult-btn" data-mult="50">x50<br><small>50구슬</small></button>
        <div id="spring-btn">
          <div id="spring-thermometer">
            <div id="spring-fill"></div>
          </div>
          <div id="spring-label">🌡️ FIRE</div>
        </div>
      </div>
    </div>

    <!-- 단계 보상 모달 -->
    <div id="stage-reward-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div id="modal-dragon-emoji" style="font-size:48px;margin-bottom:8px"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
        <button id="modal-ok-btn" class="sketch-btn">확인</button>
      </div>
    </div>

    <!-- Grand Prize 모달 -->
    <div id="grand-prize-modal" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div style="font-size:40px;margin-bottom:8px">🔥🐲🎁🐲🔥</div>
        <h2>🎉 Grand Prize!</h2>
        <p>4마리 드래곤을 모두 성장시켰습니다!</p>
        <button id="gp-ok-btn" class="sketch-btn">완료</button>
      </div>
    </div>

  </div>
</body>
</html>
