<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hidden Temple</title>
  <script type="module" crossorigin src="/assets/index-Dd22q3QH.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DOkox9pW.css">
</head>
<body>

  <div id="ui-layer" style="display:flex; flex-direction:column; width:100%; height:100%; position:absolute; top:0; left:0; pointer-events:none;">

    <!-- TOP SECTION -->
    <div class="top-section" style="display:flex; flex-direction:column; align-items:center; background:#faf8f5; pointer-events:auto; z-index:50;">
      <div class="top-bar" style="display:flex; justify-content:space-between; width:100%; padding:8px 12px; box-sizing:border-box;">
        <button id="cheat-btn" class="sketch-btn">+100 ⛏️</button>
        <div class="timer-badge">⏳ 숨겨진 사원</div>
        <button id="reset-btn" class="sketch-btn">리셋</button>
      </div>

      <!-- Door UI -->
      <div class="door-container">
        <div class="door-circle"><div class="door-inner">🚪</div></div>
      </div>

      <!-- Stage Progress Bar -->
      <div class="stage-progress" style="display:flex; justify-content:center; align-items:center; padding:4px 0;">
        <div class="chest" data-stage="1">I</div><div class="line"></div>
        <div class="chest" data-stage="2">II</div><div class="line"></div>
        <div class="chest" data-stage="3">III</div><div class="line"></div>
        <div class="chest" data-stage="4">IV</div><div class="line"></div>
        <div class="chest" data-stage="5">V</div>
      </div>

      <!-- Resource Counters -->
      <div class="counter-container" style="display:flex; gap:12px; padding:4px 0 6px;">
        <div class="pickaxe-counter">⛏️ 50</div>
        <div class="gem-counter">💎 0 / 0</div>
      </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-area" style="flex:1; display:flex; flex-direction:column; width:100%; position:relative;">

      <!-- Three.js Canvas Container -->
      <div id="canvas-container" style="flex:1; width:100%; pointer-events:auto; cursor:none; border-top:2px solid #222; border-bottom:2px solid #222; min-height:0;">
        <canvas id="game-canvas" style="width:100%; height:100%; outline:none; display:block;"></canvas>
      </div>

      <!-- Bottom Item Slots -->
      <div id="item-slot-bar" style="height:72px; display:flex; justify-content:center; align-items:center; gap:10px; pointer-events:auto; background:#faf8f5; flex-shrink:0;">
        <div class="item-slot" data-slot="0"></div>
        <div class="item-slot" data-slot="1"></div>
        <div class="item-slot" data-slot="2"></div>
      </div>
    </div>

  </div>

  <!-- Custom cursor -->
  <div id="custom-cursor">⛏️</div>

</body>
</html>
