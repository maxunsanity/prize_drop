<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dragon Nest Pinball</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #d0cdc8;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      user-select: none; -webkit-user-select: none;
    }

    #app {
      width: 390px; height: 844px;
      position: relative; overflow: hidden;
      background: #faf8f5;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    #header {
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px;
      background: #111;
      flex-shrink: 0;
    }
    .debug-group { display: flex; gap: 6px; }
    .debug-btn {
      font-size: 10px; padding: 3px 7px;
      background: #333; border: 1px solid #555; color: #ccc;
      cursor: pointer; font-family: inherit;
    }
    .debug-btn:active { opacity: 0.6; }
    #ui-total-score { font-size: 13px; font-weight: bold; color: #C8A020; }
    #ui-ball-count  { font-size: 13px; font-weight: bold; color: #cc44ff; }
    #ui-round-count { font-size: 11px; color: #888; }

    /* ── Partner gauge (placeholder) ── */
    #partner-gauge {
      height: 40px;
      background: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #partner-gauge span { font-size: 11px; color: #556; }

    /* ── Stage gauge (placeholder) ── */
    #stage-gauge {
      height: 32px;
      background: #151525;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #stage-gauge span { font-size: 11px; color: #445; }

    /* ── Canvas wrap ── */
    #canvas-wrap {
      width: 390px; height: 600px;
      position: relative; flex-shrink: 0;
    }
    #canvas-pinball { display: block; touch-action: none; }
    #float-layer {
      position: absolute; inset: 0;
      pointer-events: none; overflow: hidden;
    }

    /* ── Multiplier row ── */
    #mult-row {
      height: 116px;
      display: flex; align-items: stretch;
      background: #111;
      border-top: 2px solid #C8A020;
      flex-shrink: 0;
    }
    .mult-btn {
      flex: 1;
      background: #1a1a2e; border: none; border-right: 1px solid #333;
      color: #C8A020; font-family: inherit; font-size: 15px; font-weight: bold;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
    }
    .mult-btn small { font-size: 10px; font-weight: normal; color: #666; }
    .mult-btn.active { background: #C8A020; color: #111; }
    .mult-btn.active small { color: #333; }
    .mult-btn.unavailable { color: #333; cursor: default; }
    .mult-btn.unavailable small { color: #333; }
    .mult-btn:not(.unavailable):not(.active):hover { background: #222238; }

    /* ── Result overlay ── */
    #ui-result {
      position: absolute;
      top: 460px; left: 50%; transform: translateX(-50%);
      font-size: 22px; font-weight: bold;
      color: #ffff00; text-shadow: 0 0 8px #fff;
      pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
      white-space: nowrap;
      z-index: 10;
    }

    /* ── Float texts ── */
    .float-text {
      position: absolute; font-size: 14px; font-weight: bold;
      pointer-events: none; animation: floatUp 0.8s ease forwards;
      white-space: nowrap; color: #fff;
    }
    .float-token { color: #C8A020; font-size: 13px; }
    .float-bonus { color: #ffff00; font-size: 20px; }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-45px) scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <div id="header">
      <div class="debug-group">
        <button class="debug-btn" id="debug-add-balls">+10 🔵</button>
        <button class="debug-btn" id="debug-reset">RESET</button>
      </div>
      <span id="ui-total-score">0 pts</span>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="ui-round-count">R0</span>
        <span id="ui-ball-count">🔵 10</span>
      </div>
    </div>

    <!-- Partner gauge placeholder -->
    <div id="partner-gauge"><span>— partner gauge —</span></div>

    <!-- Stage gauge placeholder -->
    <div id="stage-gauge"><span>— stage gauge —</span></div>

    <!-- Canvas -->
    <div id="canvas-wrap">
      <canvas id="canvas-pinball" width="390" height="600"></canvas>
      <div id="float-layer"></div>
      <div id="ui-result"></div>
    </div>

    <!-- Multiplier row -->
    <div id="mult-row">
      <button class="mult-btn active" data-mult="1">x1<br><small>1구슬</small></button>
      <button class="mult-btn"        data-mult="5">x5<br><small>5구슬</small></button>
      <button class="mult-btn"        data-mult="10">x10<br><small>10구슬</small></button>
      <button class="mult-btn"        data-mult="50">x50<br><small>50구슬</small></button>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
